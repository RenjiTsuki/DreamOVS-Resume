let activeFilter = "all";


/* =========================================================
   CHECK WHETHER A ROLE HAS ADDITIONAL DETAILS
   ========================================================= */

function hasDetails(role) {
  return Boolean(
    role.duration ||
    role.committees?.length ||
    role.caucus ||
    role.awards?.length ||
    role.accomplishments?.length
  );
}


/* =========================================================
   ADD TEXT TO ROLE DETAILS
   ========================================================= */

function addText(container, label, value) {
  const line = document.createElement("div");

  const strong = document.createElement("strong");
  strong.textContent = label + " ";

  line.appendChild(strong);
  line.appendChild(document.createTextNode(value));

  container.appendChild(line);
}


/* =========================================================
   ADD LISTS TO ROLE DETAILS
   ========================================================= */

function addList(container, label, items) {
  const heading = document.createElement("div");

  const strong = document.createElement("strong");
  strong.textContent = label;

  heading.appendChild(strong);
  container.appendChild(heading);

  const list = document.createElement("ul");

  items.forEach(item => {
    const listItem = document.createElement("li");
    listItem.textContent = item;
    list.appendChild(listItem);
  });

  container.appendChild(list);
}


/* =========================================================
   CREATE A ROLE CARD
   ========================================================= */

function createRoleCard(role) {
  const wrapper = document.createElement("div");

  wrapper.className = "role-wrapper";
  wrapper.dataset.status = role.status;

  const roleItem = document.createElement("div");
  roleItem.className = "role-item";

  const titleGroup = document.createElement("div");
  titleGroup.className = "role-title-group";

  const detailsAvailable = hasDetails(role);

  if (detailsAvailable) {
    roleItem.classList.add("clickable");

    roleItem.setAttribute("role", "button");
    roleItem.setAttribute("tabindex", "0");
    roleItem.setAttribute("aria-expanded", "false");

    const arrow = document.createElement("span");

    arrow.className = "role-arrow";
    arrow.textContent = "▶";

    titleGroup.appendChild(arrow);
  }

  const title = document.createElement("span");

  title.className = "role-title";
  title.textContent = role.title;

  titleGroup.appendChild(title);

  const badge = document.createElement("span");

  badge.className = `badge ${role.status}`;
  badge.textContent =
    role.status === "current" ? "Current" : "Former";

  roleItem.appendChild(titleGroup);
  roleItem.appendChild(badge);

  wrapper.appendChild(roleItem);


  /* =========================================================
     CREATE EXPANDABLE DETAILS
     ========================================================= */

  if (detailsAvailable) {
    const details = document.createElement("div");
    details.className = "role-details";

    const content = document.createElement("div");
    content.className = "role-details-content";

    if (role.duration) {
      addText(content, "Duration:", role.duration);
    }

    if (role.caucus) {
      addText(content, "Caucus:", role.caucus);
    }

    if (role.committees?.length) {
      addList(content, "Committees:", role.committees);
    }

    if (role.awards?.length) {
      addList(content, "Awards:", role.awards);
    }

    if (role.accomplishments?.length) {
      addList(
        content,
        "Key Accomplishments:",
        role.accomplishments
      );
    }

    details.appendChild(content);
    wrapper.appendChild(details);

    const toggle = () => toggleDetails(roleItem);

    roleItem.addEventListener("click", toggle);

    roleItem.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggle();
      }
    });
  }

  return wrapper;
}


/* =========================================================
   RENDER ALL RESUME SECTIONS
   ========================================================= */

function renderResume() {
  const sections = {
    DUSA: "dusa",
    USAR: "usar",
    RxUSA: "rxusa"
  };

  Object.entries(sections).forEach(
    ([sectionName, sectionId]) => {
      const container = document.getElementById(
        `${sectionId}-roles`
      );

      const emptyMessage = document.getElementById(
        `${sectionId}-empty`
      );

      container.innerHTML = "";

      const roles = resumeData[sectionName] || [];

      roles.forEach(role => {
        container.appendChild(createRoleCard(role));
      });

      emptyMessage.style.display =
        roles.length ? "none" : "block";
    }
  );

  filterRoles(activeFilter);
}


/* =========================================================
   TOGGLE ROLE DETAILS
   ========================================================= */

function toggleDetails(roleItem) {
  const wrapper = roleItem.parentElement;
  const details = roleItem.nextElementSibling;

  if (!details) return;

  const isActive = wrapper.classList.toggle("active");

  roleItem.setAttribute(
    "aria-expanded",
    String(isActive)
  );

  details.style.maxHeight = isActive
    ? details.scrollHeight + "px"
    : "0px";
}


/* =========================================================
   FILTER ROLES
   ========================================================= */

function filterRoles(status) {
  activeFilter = status;

  document.querySelectorAll(".filter-btn").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.filter === status
    );
  });

  document.querySelectorAll(".resume-section").forEach(section => {
    const wrappers = section.querySelectorAll(".role-wrapper");

    const emptyMessage = section.querySelector(".empty-message");

    let visibleCount = 0;

    wrappers.forEach(wrapper => {
      const matches =
        status === "all" ||
        wrapper.dataset.status === status;

      wrapper.classList.toggle("hidden", !matches);

      if (matches) {
        visibleCount++;
      }

      wrapper.classList.remove("active");

      const details = wrapper.querySelector(".role-details");
      const roleItem = wrapper.querySelector(".role-item");

      if (details) {
        details.style.maxHeight = "0px";
      }

      if (roleItem) {
        roleItem.setAttribute(
          "aria-expanded",
          "false"
        );
      }
    });

    if (emptyMessage) {
      emptyMessage.style.display =
        visibleCount === 0 ? "block" : "none";
    }
  });
}


/* =========================================================
   FILTER BUTTON EVENT LISTENERS
   ========================================================= */

document.querySelectorAll(".filter-btn").forEach(button => {
  button.addEventListener("click", () => {
    filterRoles(button.dataset.filter);
  });
});


/* =========================================================

   ========================================================= */

renderResume();
